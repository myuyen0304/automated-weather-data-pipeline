# Airflow orchestration stack for the weather pipeline.
#
# This compose file runs Airflow metadata services only. The weather PostgreSQL
# database still comes from docker-compose.yml and is reached from Airflow via
# host.docker.internal:5432 on Docker Desktop.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "airflow:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: weather-airflow-local-jwt-secret-change-me
    WEATHER_PROJECT_ROOT: /opt/airflow/project
    OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1/forecast
    WEATHER_TIMEZONE: Asia/Ho_Chi_Minh
    # Khop config.ERA5_DELAY_DAYS cho ca DAG-parse va subprocess. Interpolate tu .env
    # project-root; default 5 neu khong set. Bat buoc o day de DAG va subprocess khong drift.
    ERA5_DELAY_DAYS: ${ERA5_DELAY_DAYS:-5}
    DB_HOST: host.docker.internal
    DB_PORT: "5432"
    DB_NAME: weather_db
    DB_USER: postgres
    DB_PASSWORD: postgres
    # --- Object storage (MinIO) ---
    # Bat upload CHI trong container Airflow. Endpoint dung host.docker.internal vi
    # MinIO publish port 9000 tren host (xem docker-compose.yml). Cac gia tri nay
    # thang gia tri trong .env vi config.py load_dotenv(override=False).
    OBJECT_STORAGE_ENABLED: "true"
    RAW_LOCAL_WRITE_ENABLED: "false"
    S3_ENDPOINT_URL: http://host.docker.internal:9000
    S3_BUCKET: weather-pipeline
    S3_REGION: us-east-1
    S3_RAW_PREFIX: raw/open-meteo
    S3_CLEANED_PREFIX: cleaned
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - .:/opt/airflow/project
    - ./airflow_simple_auth_passwords.json:/opt/airflow/simple_auth_manager_passwords.json.generated
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16
    container_name: weather_airflow_metadata
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow_metadata_db:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    container_name: weather_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate

  airflow-apiserver:
    <<: *airflow-common
    container_name: weather_airflow_apiserver
    restart: unless-stopped
    command: airflow api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: weather_airflow_scheduler
    restart: unless-stopped
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    container_name: weather_airflow_dag_processor
    restart: unless-stopped
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy

volumes:
  airflow_metadata_db:
