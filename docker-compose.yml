# PostgreSQL cho Automated Weather Data Pipeline.
# Bật bằng:   docker compose up -d
# Tắt bằng:   docker compose down            (giữ dữ liệu)
# Xóa sạch:   docker compose down -v         (xóa luôn volume dữ liệu)
#
# Giá trị POSTGRES_* phải khớp với file .env (DB_NAME / DB_USER / DB_PASSWORD).

services:
  postgres:
    image: postgres:16
    container_name: weather_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weather_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - weather_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: weather_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Tiet kiem dung luong dia: nen trong suot cac file .json/.csv khi luu,
      # tu dong giai nen khi doc. Weather JSON/CSV nen duoc ~5-10x. Khong mat du lieu.
      MINIO_COMPRESSION_ENABLE: "on"
      MINIO_COMPRESSION_EXTENSIONS: ".json,.csv"
      MINIO_COMPRESSION_MIME_TYPES: "application/json,text/csv"
    ports:
      # 9000 (S3 API) bind 0.0.0.0 de container Airflow goi duoc qua host.docker.internal:9000.
      - "9000:9000"
      # 9001 (Console) chi mo tren may local cho an toan.
      - "127.0.0.1:9001:9001"
    volumes:
      - weather_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Tao san bucket khop voi code (src/config.py -> S3_BUCKET=weather-pipeline).
  # Khong bat buoc: object_storage.ensure_bucket_exists() cung tu tao khi upload lan dau.
  createbuckets:
    image: minio/mc:latest
    container_name: weather_minio_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb --ignore-existing local/${S3_BUCKET:-weather-pipeline};
      exit 0;
      "
    restart: "no"

  # Pipeline chạy HOÀN TOÀN trong Docker (không cần Python local). Đặt sau profile
  # "tools" nên `docker compose up -d` KHÔNG khởi động nó; `docker compose run` vẫn
  # tự bật service này + các dependency (postgres, minio) dù có profile.
  #   docker compose run --rm pipeline python src/main.py --init-db
  #   docker compose run --rm pipeline python src/backfill_weather.py --start-date 2026-05-10 --end-date 2026-06-08
  #   docker compose run --rm pipeline python src/main.py --skip-extract --all-raw --load
  #   docker compose run --rm pipeline python src/main.py --skip-extract --load-agriculture
  #   docker compose run --rm pipeline dbt build --project-dir weather_dbt   # dựng tầng mart
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-pipeline:latest
    container_name: weather_pipeline
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Trong cùng compose network -> gọi nhau bằng TÊN SERVICE, không phải 127.0.0.1.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: weather_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1/forecast
      WEATHER_TIMEZONE: Asia/Ho_Chi_Minh
      ERA5_DELAY_DAYS: ${ERA5_DELAY_DAYS:-5}
      # Raw + cleaned ghi thẳng MinIO, không giữ bản local trong container.
      OBJECT_STORAGE_ENABLED: "true"
      RAW_LOCAL_WRITE_ENABLED: "false"
      CLEANED_LOCAL_WRITE_ENABLED: "false"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-weather-pipeline}
      S3_REGION: us-east-1
      S3_RAW_PREFIX: raw/open-meteo
      S3_CLEANED_PREFIX: cleaned
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  # Chạy pytest trong container (dev không cần Python local). Test tự monkeypatch
  # flag object-storage nên KHÔNG cần Postgres/MinIO -> không depends_on.
  #   docker compose run --rm tests
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-pipeline:latest
    container_name: weather_pipeline_tests
    profiles: ["tools"]
    environment:
      OBJECT_STORAGE_ENABLED: "false"
    command: ["pytest"]
    restart: "no"

volumes:
  weather_pgdata:
  weather_minio_data:
